<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Register Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>
    <section class="bg-dark">
        <div class="container vh-100 w-50 d-flex justify-content-center align-items-center">

            <div class="row w-100 m-3">

                <!-- Login Form -->
                <div class="col-md-12 show" id="loginF">
                    <div class="card p-5 shadow bg-dark-subtle">

                        <h3 class="text-center my-3">Login</h3>

                        <form id="loginForm">

                            <div class="my-3">
                                <label for="nameL" class="form-label">
                                    Name
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <input type="text" class="form-control" id="nameL" name="username"
                                        autocomplete="username" required>
                                </div>
                            </div>

                            <div class="my-3">
                                <label for="pasL" class="form-label">
                                    Password
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-journal-check"></i>
                                    </span>

                                    <input type="password" class="form-control" id="pasL" name="password"
                                        autocomplete="current-password" required>
                                </div>
                            </div>

                            <div class="my-3 p-2 text-center row justify-content-center">

                                <button class="btn btn-outline-primary col-6 swich" type="button">
                                    Switch
                                </button>

                                <button class="btn btn-success col-12 mt-3" type="submit" id="btnL">
                                    Login
                                </button>

                            </div>

                            <p class="text-center text-muted lead fs-5 fw-bold" id="pL" aria-live="polite"></p>

                        </form>
                    </div>
                </div>

                <!-- Register Form -->
                <div class="col-md-12 hidden" id="regasterF">
                    <div class="card p-5 shadow bg-dark-subtle">

                        <h3 class="text-center my-3">Register</h3>

                        <form id="registerForm">

                            <div class="my-3">
                                <label for="nameR" class="form-label">
                                    Name
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <input type="text" class="form-control" id="nameR" name="username"
                                        autocomplete="username" required>
                                </div>
                            </div>

                            <div class="my-3">
                                <label for="pasR" class="form-label">
                                    Password
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-journal-check"></i>
                                    </span>

                                    <input type="password" class="form-control" id="pasR" name="password"
                                        autocomplete="new-password" required>
                                </div>
                            </div>

                            <div class="my-3">
                                <label for="phone" class="form-label">
                                    Phone
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-telephone"></i>
                                    </span>

                                    <input type="tel" class="form-control" id="phone" name="phone" inputmode="numeric"
                                        pattern="09[0-9]{9}" placeholder="09123456789" autocomplete="tel" required>
                                </div>
                            </div>

                            <div class="my-3 p-2 text-center row justify-content-center">

                                <button class="btn btn-outline-primary col-6 swich" type="button">
                                    Switch
                                </button>

                                <button class="btn btn-success col-12 mt-3" type="submit" id="btnR">
                                    Register
                                </button>

                            </div>

                            <p class="text-center text-muted lead fs-5 fw-bold" id="pR" aria-live="polite"></p>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script defer src="../JavaScript/login.js"></script>
</body>

</html>
